<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Key Sytems</title>

<style>
body {
    background: #020617;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 60px;
}

.box {
    background: #020617;
    border: 2px solid #22c55e;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 380px;
    margin: auto;
}

button {
    background: #22c55e;
    border: none;
    padding: 12px 22px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}

button:disabled {
    background: #555;
}

.key {
    margin-top: 15px;
    font-size: 18px;
    color: #38bdf8;
    word-break: break-all;
}

.note {
    margin-top: 10px;
    font-size: 14px;
    color: #a1a1aa;
}
</style>
</head>

<body>

<div class="box">
    <h2>Kiwi Hub Key Sytems</h2>
    <p>Bấm <b>Get Key</b> → Nhận Key 24h</p>

    <button id="btn" onclick="startGetKey()">GET KEY</button>

    <div class="note" id="status">Chưa lấy key</div>
    <div class="key" id="keyBox"></div>
</div>

<script>
/* ================== CONFIG ================== */

// ⏰ KEY SỐNG 24 GIỜ
const KEY_LIFETIME = 24 * 60 * 60 * 1000;

// 🔴 LINK4M CỦA BẠN (ĐÃ THAY)
const LINK4M_URL = "https://link4m.com/mWbel";

/* ============================================ */

// 🔐 TẠO KEY RANDOM
function makeKey() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let key = "Kiwi-";
    for (let i = 0; i < 12; i++) {
        key += chars[Math.floor(Math.random() * chars.length)];
    }
    return key;
}

// 👉 BẤM GET KEY → CHUYỂN LINK4M
function startGetKey() {
    document.getElementById("status").innerText = "Đang chuyển tới link vượt...";
    document.getElementById("btn").disabled = true;
    window.location.href = LINK4M_URL;
}

// ✅ KHI QUAY LẠI WEB
window.onload = function () {
    const url = new URL(window.location.href);
    const verified = url.searchParams.get("verified");

    const used = localStorage.getItem("key_used");
    const savedKey = localStorage.getItem("getkey_key");
    const savedTime = localStorage.getItem("getkey_time");

    // ❌ Key đã dùng
    if (used === "1") {
        document.getElementById("status").innerText = "Key đã được sử dụng";
        return;
    }

    // ⏳ Key còn hạn
    if (savedKey && savedTime) {
        if (Date.now() - Number(savedTime) < KEY_LIFETIME) {
            document.getElementById("keyBox").innerText = savedKey;
            document.getElementById("status").innerText = "Hạn Sử Dụng 24H";
            return;
        } else {
            localStorage.clear();
        }
    }

    // 🎉 VƯỢT LINK XONG
    if (verified === "1") {
        const key = makeKey();
        localStorage.setItem("getkey_key", key);
        localStorage.setItem("getkey_time", Date.now());
        localStorage.setItem("key_used", "0");

        document.getElementById("keyBox").innerText = key;
        document.getElementById("status").innerText = "🎉 Lấy Key Thành Công";
        document.getElementById("btn").disabled = false;
    }
};
</script>

</body>
</html>
