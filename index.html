<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiwi Key Sytems 🥝</title>

<style>
body {
    background: #020617;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 60px;
}

.box {
    background: #020617;
    border: 2px solid #22c55e;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 380px;
    margin: auto;
}

button {
    background: #22c55e;
    border: none;
    padding: 12px 22px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}

button:disabled {
    background: #555;
}

.key {
    margin-top: 15px;
    font-size: 18px;
    color: #38bdf8;
    word-break: break-all;
}

.note {
    margin-top: 10px;
    font-size: 14px;
    color: #a1a1aa;
}

#timeLeft {
    margin-top: 6px;
    font-size: 13px;
    color: #facc15;
}
</style>
</head>

<body>

<div class="box">
    <h2>Kiwi Key Sytems</h2>
    <p>Bấm <b>GET KEY</b> Để Nhận Link Get Key</p>

    <button id="btn" onclick="startGetKey()">GET KEY</button>

    <div class="note" id="status">Chưa lấy key</div>
    <div class="key" id="keyBox"></div>
    <div class="note" id="timeLeft"></div>
</div>

<script>
/* ================== CONFIG ================== */
const KEY_LIFETIME = 24 * 60 * 60 * 1000; // 24 giờ
const LINK4M_URL = "https://link4sub.com/LU9Zu9TZgf"; // Link4m của bạn
let timerInterval = null;

/* ================== FUNCTIONS ================== */
function makeKey() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let key = "Kiwi-";
    for (let i = 0; i < 12; i++) {
        key += chars[Math.floor(Math.random() * chars.length)];
    }
    return key;
}

function startGetKey() {
    document.getElementById("status").innerText = "Đang chuyển tới link vượt...";
    document.getElementById("btn").disabled = true;
    window.location.href = LINK4M_URL;
}

function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return `${h}h ${m}m ${s}s`;
}

function startCountdown(startTime) {
    const timeBox = document.getElementById("timeLeft");

    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(() => {
        const left = KEY_LIFETIME - (Date.now() - startTime);

        if (left <= 0) {
            clearInterval(timerInterval);
            localStorage.clear();
            timeBox.innerText = "Key Đã Hết Hạn";
            document.getElementById("keyBox").innerText = "";
            document.getElementById("status").innerText = "Vui lòng lấy key mới";
            document.title = "Key Hết Hạn";
            return;
        }

        timeBox.innerText = "Thời Gian Còn Lại: " + formatTime(left);
    }, 1000);
}

/* ================== ONLOAD ================== */
window.onload = function () {
    const url = new URL(window.location.href);
    const verified = url.searchParams.get("verified");

    const used = localStorage.getItem("key_used");
    const savedKey = localStorage.getItem("getkey_key");
    const savedTime = localStorage.getItem("getkey_time");

    // Key đã dùng
    if (used === "1") {
        document.getElementById("status").innerText = "Key đã được sử dụng";
        document.getElementById("timeLeft").innerText = "";
        document.title = "Key đã dùng";
        return;
    }

    // Key còn hạn
    if (savedKey && savedTime) {
        if (Date.now() - Number(savedTime) < KEY_LIFETIME) {
            document.getElementById("keyBox").innerText = savedKey;
            document.getElementById("status").innerText = "Thời Gian Còn Lại 24H";
            startCountdown(Number(savedTime));
            document.title = "Key còn hiệu lực";
            return;
        } else {
            localStorage.clear();
        }
    }

    // Vừa vượt Link4m xong
    if (verified === "1") {
        const key = makeKey();
        localStorage.setItem("getkey_key", key);
        localStorage.setItem("getkey_time", Date.now());
        localStorage.setItem("key_used", "0");

        document.getElementById("keyBox").innerText = key;
        document.getElementById("status").innerText = "🎉 Lấy Key Thành Công";
        document.getElementById("btn").disabled = false;
        startCountdown(Date.now());
        document.title = "Key sẵn sàng!";
    }
};
</script>

</body>
</html>
